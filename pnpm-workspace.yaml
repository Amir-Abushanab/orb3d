packages:
  - "apps/*"
  - "packages/*"

# pnpm reads package settings from here (not the package.json "pnpm" field).
#
# pnpm refuses to install (ERR_PNPM_IGNORED_BUILDS) until every dependency it records as having a
# build step is listed here as true or false, and it records playwright as one. playwright ships
# no install script, so allowing it runs nothing; in particular no browser is fetched at install
# time. `pnpm render` needs one: run `pnpm exec playwright install chromium` once.
allowBuilds:
  playwright: true

# tweakpane 4 ships types that re-export @tweakpane/core but doesn't declare it as a dependency.
# Declare it as a peer so pnpm nests @tweakpane/core under tweakpane and the Pane types
# (addFolder/refresh/binding events) stay resolvable. The studio provides it as a devDependency.
packageExtensions:
  tweakpane:
    peerDependencies:
      "@tweakpane/core": "*"

# Supply-chain cooldown, in two layers. This is the install-time one: never install a version
# published less than 7 days ago (10080 minutes), transitive dependencies included. Without it,
# pnpm resolves anything inside a `^` range however fresh (its built-in default is one day,
# non-strict). The other layer, `cooldown: 7` in .ncurc.yml, only governs which versions
# npm-check-updates proposes for direct deps. Setting this explicitly makes it strict, and
# `pnpm install --frozen-lockfile` re-checks every lockfile entry against it, so a lockfile
# resolved without it fails until it is re-resolved.
minimumReleaseAge: 10080
