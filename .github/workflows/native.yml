name: Native checks

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  swift:
    name: Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
      - run: swift test

  android:
    name: Android library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon :orb3d:assembleRelease :sample:assembleDebug
